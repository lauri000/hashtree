name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.3)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (static musl)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # Linux aarch64 (static musl)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-14
            cross: false
          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (cross)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} -p git-remote-htree
          cross build --release --target ${{ matrix.target }} -p hashtree-cashu-cli
          cross build --release --target ${{ matrix.target }} -p hashtree-cli

      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} -p git-remote-htree
          cargo build --release --target ${{ matrix.target }} -p hashtree-cashu-cli
          cargo build --release --target ${{ matrix.target }} -p hashtree-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/hashtree
          cp target/${{ matrix.target }}/release/git-remote-htree dist/hashtree/
          cp target/${{ matrix.target }}/release/htree-cashu dist/hashtree/
          cp target/${{ matrix.target }}/release/htree dist/hashtree/
          
          # Create install script
          cat > dist/hashtree/install.sh << 'EOF'
          #!/bin/bash
          set -e
          
          INSTALL_DIR="${1:-/usr/local/bin}"
          
          echo "Installing hashtree binaries to $INSTALL_DIR"
          
          if [ ! -w "$INSTALL_DIR" ]; then
            echo "Need sudo to install to $INSTALL_DIR"
            sudo install -m 755 htree htree-cashu git-remote-htree "$INSTALL_DIR/"
          else
            install -m 755 htree htree-cashu git-remote-htree "$INSTALL_DIR/"
          fi
          
          echo "✓ Installed htree, htree-cashu, and git-remote-htree"
          echo ""
          echo "Verify with:"
          echo "  htree --help"
          echo "  htree cashu balance"
          echo "  git clone htree://npub1.../repo"
          EOF
          chmod +x dist/hashtree/install.sh
          
          # Create README
          cat > dist/hashtree/README.txt << 'EOF'
          hashtree - Git over Nostr via Merkle trees
          ==========================================
          
          Binaries included:
            htree             - CLI and daemon for hashtree operations
            htree-cashu       - Cashu wallet helper for htree cashu
            git-remote-htree  - Git remote helper for htree:// URLs
          
          Quick install:
            ./install.sh              # installs to /usr/local/bin (may need sudo)
            ./install.sh ~/.local/bin # installs to custom directory
          
          Manual install:
            cp htree htree-cashu git-remote-htree /usr/local/bin/
          
          Usage:
            htree add <file>                    # add file to hashtree
            htree get <hash>                    # download by hash
            htree start                         # start P2P daemon
            htree cashu balance                # inspect Cashu wallet
            git clone htree://npub1.../repo     # clone git repo
            git remote add htree htree://self/myrepo
            git push htree main
          
          More info: https://github.com/mmalmi/hashtree
          EOF
          
          cd dist
          tar -czvf hashtree-${{ matrix.target }}.tar.gz hashtree
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum hashtree-${{ matrix.target }}.tar.gz > hashtree-${{ matrix.target }}.sha256
          else
            shasum -a 256 hashtree-${{ matrix.target }}.tar.gz > hashtree-${{ matrix.target }}.sha256
          fi
          rm -rf hashtree

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/hashtree
          Copy-Item target/${{ matrix.target }}/release/git-remote-htree.exe dist/hashtree/
          Copy-Item target/${{ matrix.target }}/release/htree-cashu.exe dist/hashtree/
          Copy-Item target/${{ matrix.target }}/release/htree.exe dist/hashtree/
          
          # Create README
          @"
          hashtree - Git over Nostr via Merkle trees
          ==========================================
          
          Binaries included:
            htree.exe             - CLI and daemon for hashtree operations
            htree-cashu.exe       - Cashu wallet helper for htree cashu
            git-remote-htree.exe  - Git remote helper for htree:// URLs
          
          Install:
            Copy all three .exe files to a directory in your PATH, e.g.:
            C:\Users\<you>\AppData\Local\Microsoft\WindowsApps\
          
          Usage:
            htree add <file>                    # add file to hashtree
            htree get <hash>                    # download by hash
            htree start                         # start P2P daemon
            htree cashu balance                 # inspect Cashu wallet
            git clone htree://npub1.../repo     # clone git repo
          
          More info: https://github.com/mmalmi/hashtree
          "@ | Out-File -FilePath dist/hashtree/README.txt -Encoding UTF8
          
          Compress-Archive -Path dist/hashtree -DestinationPath dist/hashtree-${{ matrix.target }}.zip
          $hash = (Get-FileHash dist/hashtree-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  hashtree-${{ matrix.target }}.zip" | Out-File -FilePath dist/hashtree-${{ matrix.target }}.sha256 -Encoding ASCII
          Remove-Item -Recurse dist/hashtree

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashtree-${{ matrix.target }}
          path: rust/dist/hashtree-*
          retention-days: 7

  iris-release-metadata:
    name: Determine Iris release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asset_version: ${{ steps.version.outputs.asset_version }}
      asset_prefix: ${{ steps.version.outputs.asset_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine Iris asset version
        id: version
        shell: bash
        run: |
          asset_version="$(jq -r '.version' apps/iris/package.json)"
          if [ -z "${asset_version}" ] || [ "${asset_version}" = "null" ]; then
            echo "Iris version missing from apps/iris/package.json"
            exit 1
          fi

          echo "asset_version=${asset_version}" >> "${GITHUB_OUTPUT}"
          echo "asset_prefix=iris-${asset_version}" >> "${GITHUB_OUTPUT}"

  build-macos-app:
    name: Build macOS Iris app
    runs-on: macos-14
    needs:
      - iris-release-metadata
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.release_gate.outputs.release_ready }}
      release_reason: ${{ steps.release_gate.outputs.release_reason }}
    env:
      IRIS_ASSET_PREFIX: ${{ needs.iris-release-metadata.outputs.asset_prefix }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
      MACOS_NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
      MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/iris/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/iris/pnpm-lock.yaml

      - name: Install Iris dependencies
        run: pnpm --dir apps/iris install --frozen-lockfile

      - name: Determine macOS signing mode
        id: signing
        shell: bash
        run: |
          required=(
            MACOS_SIGNING_IDENTITY
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            MACOS_NOTARIZE_APPLE_ID
            MACOS_NOTARIZE_APP_PASSWORD
            MACOS_NOTARIZE_TEAM_ID
          )
          missing=()

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Building unsigned macOS app artifact because signing secrets are missing: ${missing[*]}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install macOS signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/iris-signing.keychain-db"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-temp_signing_password}"
          CERT_PATH="$RUNNER_TEMP/iris-signing-cert.p12"

          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${CERT_PATH}" 2>/dev/null || \
            printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 -D > "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"

          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -Fq "${MACOS_SIGNING_IDENTITY}"; then
            echo "Expected signing identity not found: ${MACOS_SIGNING_IDENTITY}"
            exit 1
          fi

      - name: Build macOS Iris app bundle
        run: pnpm --dir apps/iris exec tauri build --target aarch64-apple-darwin --bundles app --no-sign --ci

      - name: Locate macOS app bundle
        id: locate_app
        shell: bash
        run: |
          candidates=(
            "apps/iris/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
            "apps/iris/src-tauri/target/release/bundle/macos"
            "target/aarch64-apple-darwin/release/bundle/macos"
            "target/release/bundle/macos"
          )

          for candidate in "${candidates[@]}"; do
            if [ ! -d "${candidate}" ]; then
              continue
            fi

            app_path="$(find "${candidate}" -maxdepth 1 -name '*.app' -print -quit)"
            if [ -n "${app_path}" ]; then
              echo "app_path=${app_path}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done

          echo "No macOS .app bundle found in build output"
          exit 1

      - name: Code sign macOS app
        id: codesign
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          if [ -f "apps/iris/src-tauri/Release.entitlements" ]; then
            codesign --force --deep --options runtime --timestamp \
              --entitlements apps/iris/src-tauri/Release.entitlements \
              --sign "${MACOS_SIGNING_IDENTITY}" \
              "${APP_PATH}"
          else
            codesign --force --deep --options runtime --timestamp \
              --sign "${MACOS_SIGNING_IDENTITY}" \
              "${APP_PATH}"
          fi

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Notarize macOS app
        id: notarize
        if: steps.signing.outputs.enabled == 'true' && steps.codesign.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          NOTARIZE_ZIP="$RUNNER_TEMP/iris-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${NOTARIZE_ZIP}"

          SUBMIT_OUTPUT="$(xcrun notarytool submit "${NOTARIZE_ZIP}" \
            --apple-id "${MACOS_NOTARIZE_APPLE_ID}" \
            --password "${MACOS_NOTARIZE_APP_PASSWORD}" \
            --team-id "${MACOS_NOTARIZE_TEAM_ID}" \
            --wait \
            --output-format json)"

          echo "${SUBMIT_OUTPUT}"

          SUBMISSION_ID="$(printf '%s' "${SUBMIT_OUTPUT}" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
          SUBMISSION_STATUS="$(printf '%s' "${SUBMIT_OUTPUT}" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"

          if [ "${SUBMISSION_STATUS}" != "Accepted" ]; then
            echo "Notarization status was '${SUBMISSION_STATUS}' (expected 'Accepted')."
            if [ -n "${SUBMISSION_ID}" ]; then
              xcrun notarytool log "${SUBMISSION_ID}" \
                --apple-id "${MACOS_NOTARIZE_APPLE_ID}" \
                --password "${MACOS_NOTARIZE_APP_PASSWORD}" \
                --team-id "${MACOS_NOTARIZE_TEAM_ID}" || true
            fi
            exit 1
          fi

          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

      - name: Determine Iris release readiness
        id: release_gate
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" != "true" ]; then
            echo "release_ready=false" >> "${GITHUB_OUTPUT}"
            echo "release_reason=macOS signing or notarization secrets were unavailable" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${{ steps.codesign.outcome }}" != "success" ]; then
            echo "release_ready=false" >> "${GITHUB_OUTPUT}"
            echo "release_reason=macOS code signing failed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${{ steps.notarize.outcome }}" != "success" ]; then
            echo "release_ready=false" >> "${GITHUB_OUTPUT}"
            echo "release_reason=macOS notarization failed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "release_ready=true" >> "${GITHUB_OUTPUT}"
          echo "release_reason=macOS signing and notarization succeeded" >> "${GITHUB_OUTPUT}"

      - name: Package macOS app artifact
        if: steps.release_gate.outputs.release_ready == 'true'
        shell: bash
        run: |
          mkdir -p dist
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "dist/${IRIS_ASSET_PREFIX}-macos-arm64.zip"

      - name: Verify packaged macOS app artifact
        if: steps.release_gate.outputs.release_ready == 'true'
        shell: bash
        run: |
          VERIFY_DIR="$RUNNER_TEMP/iris-package-verify"
          rm -rf "${VERIFY_DIR}"
          mkdir -p "${VERIFY_DIR}"

          ditto -x -k "dist/${IRIS_ASSET_PREFIX}-macos-arm64.zip" "${VERIFY_DIR}"

          APP_PATH="$(find "${VERIFY_DIR}" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "Packaged zip did not contain a macOS .app bundle"
            exit 1
          fi

          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
            spctl --assess --type execute --verbose=4 "${APP_PATH}"
          else
            echo "Unsigned macOS app artifact verified for structure only."
          fi

      - name: Upload macOS app artifact
        if: steps.release_gate.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iris-macos-arm64
          path: dist/${{ env.IRIS_ASSET_PREFIX }}-macos-arm64.zip
          retention-days: 7

      - name: Skip Iris release assets
        if: steps.release_gate.outputs.release_ready != 'true'
        shell: bash
        run: |
          echo "Iris release assets disabled: ${{ steps.release_gate.outputs.release_reason }}"

      - name: Cleanup macOS signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/iris-signing.keychain-db"
          security delete-keychain "${KEYCHAIN_PATH}" || true
          rm -f "$RUNNER_TEMP/iris-signing-cert.p12" "$RUNNER_TEMP/iris-notarize.zip"

  build-linux-app:
    name: Build Linux Iris app
    runs-on: ubuntu-24.04
    needs:
      - iris-release-metadata
    permissions:
      contents: read
    env:
      IRIS_ASSET_PREFIX: ${{ needs.iris-release-metadata.outputs.asset_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/iris/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/iris/pnpm-lock.yaml

      - name: Install Iris dependencies
        run: pnpm --dir apps/iris install --frozen-lockfile

      - name: Build Linux Iris bundles
        run: pnpm --dir apps/iris exec tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb --ci

      - name: Package Linux artifacts
        shell: bash
        run: |
          mkdir -p dist

          candidates=(
            "apps/iris/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
            "apps/iris/src-tauri/target/release/bundle"
            "target/x86_64-unknown-linux-gnu/release/bundle"
            "target/release/bundle"
          )

          appimage=""
          deb=""

          for candidate in "${candidates[@]}"; do
            if [ -z "${appimage}" ] && [ -d "${candidate}/appimage" ]; then
              appimage="$(find "${candidate}/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
            fi
            if [ -z "${deb}" ] && [ -d "${candidate}/deb" ]; then
              deb="$(find "${candidate}/deb" -maxdepth 1 -name '*.deb' -print -quit)"
            fi
          done

          if [ -z "${appimage}" ]; then
            echo "No Linux AppImage bundle found in build output"
            exit 1
          fi

          if [ -z "${deb}" ]; then
            echo "No Linux .deb bundle found in build output"
            exit 1
          fi

          cp "${appimage}" "dist/${IRIS_ASSET_PREFIX}-linux-x86_64.AppImage"
          cp "${deb}" "dist/${IRIS_ASSET_PREFIX}-linux-x86_64.deb"
          sha256sum "dist/${IRIS_ASSET_PREFIX}-linux-x86_64.AppImage" > "dist/${IRIS_ASSET_PREFIX}-linux-x86_64.AppImage.sha256"
          sha256sum "dist/${IRIS_ASSET_PREFIX}-linux-x86_64.deb" > "dist/${IRIS_ASSET_PREFIX}-linux-x86_64.deb.sha256"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iris-linux-x86_64
          path: dist/${{ env.IRIS_ASSET_PREFIX }}-linux-x86_64*
          retention-days: 7

  build-windows-app:
    name: Build Windows Iris app
    runs-on: windows-latest
    needs:
      - iris-release-metadata
    permissions:
      contents: read
    env:
      IRIS_ASSET_PREFIX: ${{ needs.iris-release-metadata.outputs.asset_prefix }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/iris/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/iris/pnpm-lock.yaml

      - name: Install Iris dependencies
        run: pnpm --dir apps/iris install --frozen-lockfile

      - name: Build Windows Iris bundles
        run: pnpm --dir apps/iris exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $candidates = @(
            'apps/iris/src-tauri/target/x86_64-pc-windows-msvc/release/bundle',
            'apps/iris/src-tauri/target/release/bundle',
            'target/x86_64-pc-windows-msvc/release/bundle',
            'target/release/bundle'
          )

          $nsis = $null

          foreach ($candidate in $candidates) {
            if (-not $nsis -and (Test-Path (Join-Path $candidate 'nsis'))) {
              $nsis = Get-ChildItem -Path (Join-Path $candidate 'nsis') -Filter '*-setup.exe' | Select-Object -First 1
            }
          }

          if (-not $nsis) {
            throw 'No Windows NSIS installer found in build output'
          }

          Copy-Item $nsis.FullName "dist/$env:IRIS_ASSET_PREFIX-windows-x64-setup.exe"

          $nsisHash = (Get-FileHash "dist/$env:IRIS_ASSET_PREFIX-windows-x64-setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$nsisHash  $env:IRIS_ASSET_PREFIX-windows-x64-setup.exe" | Out-File -FilePath "dist/$env:IRIS_ASSET_PREFIX-windows-x64-setup.exe.sha256" -Encoding ASCII

      - name: Detect Windows signing capabilities
        id: windows_capabilities
        shell: bash
        run: |
          signing_required=(
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_CODE_SIGNING_ENDPOINT
            AZURE_CODE_SIGNING_ACCOUNT_NAME
            AZURE_CERTIFICATE_PROFILE_NAME
          )
          missing=()
          for name in "${signing_required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signing_ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "signing_ready=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Windows signing secrets missing: ${missing[*]}. The release will continue with an unsigned installer."
          fi

      - name: Sign Windows installer
        id: sign_windows
        if: ${{ steps.windows_capabilities.outputs.signing_ready == 'true' }}
        continue-on-error: true
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ env.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Warn if signing failed
        if: ${{ steps.windows_capabilities.outputs.signing_ready == 'true' && steps.sign_windows.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::Windows code signing was attempted but failed (identity validation may still be pending). The release will continue with an unsigned installer."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iris-windows-x64
          path: dist/${{ env.IRIS_ASSET_PREFIX }}-windows-x64*
          retention-days: 7

  release:
    name: Create Release
    needs:
      - build
      - iris-release-metadata
      - build-macos-app
      - build-linux-app
      - build-windows-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release commit
        id: release_commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Download hashtree artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hashtree-*
          path: artifacts/hashtree
          merge-multiple: true

      - name: Download Iris artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iris-*
          path: artifacts/iris
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: find artifacts -maxdepth 2 -type f | sort

      - name: Prepare release assets and notes
        id: release_assets
        shell: bash
        env:
          IRIS_MACOS_RELEASE_READY: ${{ needs.build-macos-app.outputs.release_ready }}
          IRIS_MACOS_RELEASE_REASON: ${{ needs.build-macos-app.outputs.release_reason }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=()
          iris_asset_count=0
          for file in artifacts/hashtree/*; do
            if [ -f "${file}" ]; then
              files+=("${file}")
            fi
          done

          for file in artifacts/iris/*; do
            if [ -f "${file}" ]; then
              files+=("${file}")
              iris_asset_count=$((iris_asset_count + 1))
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          render_args=(
            --tag "${{ github.event.inputs.tag || github.ref_name }}"
            --commit "${{ steps.release_commit.outputs.sha }}"
            --cli-dir artifacts/hashtree
            --output-file release-body.md
            --install-url "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}/install.sh"
          )

          if [ "${iris_asset_count}" -gt 0 ]; then
            render_args+=(--iris-assets-dir artifacts/iris)
          else
            echo "Rendering notes without Iris assets."
          fi

          if [ "${IRIS_MACOS_RELEASE_READY}" != "true" ]; then
            echo "macOS Iris release asset unavailable: ${IRIS_MACOS_RELEASE_REASON}"
          fi

          node scripts/render_repo_release_notes.mjs "${render_args[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: ${{ steps.release_assets.outputs.files }}
          body_path: release-body.md
